<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANTACOSTA</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-vivo: #e2ff8f;
            --verde-escuro: #505a50;
            --verde-medio: #697369;
            --fundo-claro: #f5f7f6;
            --fundo-medio: #e5eae7;
            --verde-escuro-fundo: #202420;
            --zoom: 1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--verde-escuro-fundo);
            height: 100vh;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- BACKGROUND DINÂMICO --- */
        #bg-performance {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            transform: scale(var(--zoom));
            transition: transform 0.1s ease-out;
            cursor: crosshair; 
        }

        /* --- HERO CONTAINER (Controla o Alinhamento Global) --- */
        .hero-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 100vw;
            pointer-events: none;
            padding: 0 4vw;
        }

        /* A "caixa" interna ganha a largura do elemento mais largo (a logo) */
        .hero-content {
            display: flex;
            flex-direction: column;
            width: max-content; 
            max-width: 100%;
        }

        .logo, .nav-curadoria, #banner-destaque {
            pointer-events: auto;
        }

        /* --- ANIMAÇÕES (MANTIDAS EXATAMENTE COMO SOLICITADO) --- */
        @keyframes pulsacaoCor {
            0% { color: var(--verde-vivo); }
            100% { color: var(--fundo-medio); }
        }

        @keyframes pulsacaoBackground {
            0% { background-color: var(--verde-vivo); }
            100% { background-color: var(--fundo-claro); }
        }

        /* --- LOGO --- */
        .logo {
            font-weight: 800;
            letter-spacing: -4px;
            font-size: clamp(4rem, 14vw, 11rem);
            line-height: 0.85;
            text-transform: uppercase;
            animation: pulsacaoCor 30s ease-in-out infinite alternate;
            will-change: color;
            text-decoration: none;
            margin-bottom: 50px; /* Padding generoso */
            text-align: center;
            width: 100%;
        }

        /* --- BANNER INTEGRADO LAGO --- */
        #banner-destaque {
            width: 100%; /* Preenche exatamente a largura de SANTACOSTA */
            animation: pulsacaoBackground 30s ease-in-out infinite alternate;
            padding: 32px 40px;
            text-decoration: none;
            color: var(--verde-escuro-fundo);
            display: grid;
            grid-template-columns: 1.3fr 1fr; /* Coluna 1 (Título) recebe mais espaço */
            gap: 30px;
            align-items: center;
            margin-bottom: 50px; /* Padding generoso */
            border: 1px solid var(--verde-escuro-fundo);
            opacity: 0.88;
        }

        #banner-destaque:hover {
            background-color: var(--fundo-medio);
            animation: none;
        }

        /* Colunas do Banner */
        .banner-col-esq {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        .banner-col-dir {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            border-left: 1px solid rgba(32, 36, 32, 0.2);
            padding-left: 30px;
        }

        /* Tipografia Responsiva (Clamps) */
        .banner-badge {
            font-size: clamp(0.7rem, 1vw, 0.8rem);
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 12px;
            opacity: 0.7;
            text-transform: uppercase;
            text-decoration: underline;
            text-decoration-color: var(--fundo-medio);
            text-underline-offset: -4px;
            text-decoration-thickness: 6px;
            text-decoration-skip-ink: none;
        }

        .banner-titulo {
            font-size: clamp(1.8rem, 3.5vw, 3rem); /* Título bem destacado */
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -1px;
        }

        .banner-local {
            font-size: clamp(1rem, 1.5vw, 1.2rem);
            font-weight: 800;
        }

        .banner-info-extra {
            margin-top: 10px;
            font-size: clamp(0.85rem, 1.1vw, 0.95rem);
            line-height: 1.4;
            font-weight: 500;
        }

        /* --- NAV CURADORIA --- */
        .nav-curadoria {
            width: 100%; /* Preenche a largura ditada pela logo */
            display: flex;
            justify-content: space-between; /* Espalha as palavras até as bordas exatas */
            align-items: center;
            -webkit-text-stroke: 0.3px var(--verde-medio);
        }

        .nav-curadoria a {
            text-decoration: none;
            animation: pulsacaoCor 30s ease-in-out infinite alternate;
            font-weight: 800;
            text-transform: uppercase;
            font-size: clamp(0.8rem, 2.7vw, 2.7rem);
            transition: text-decoration-color 0.2s ease;
            text-decoration-color: transparent;
        }

        .nav-curadoria a:hover {
            text-decoration: underline;
            text-decoration-color: var(--verde-medio);
            text-underline-offset: 0px;
            text-decoration-thickness: 10px;
            text-decoration-skip-ink: none;
        }

        /* --- RESPONSIVIDADE --- */
        @media (max-width: 900px) {
            .logo { margin-bottom: 30px; margin-top: -10vh; }
            
            #banner-destaque { 
                grid-template-columns: 1fr; /* Colapsa para 1 coluna no mobile */
                margin-bottom: 30px; 
                padding: 24px; 
            }

            .banner-col-esq, .banner-col-dir {
                align-items: center;
                text-align: center;
                border-left: none;
                padding-left: 0;
            }

            .banner-col-dir {
                border-top: 1px solid rgba(32, 36, 32, 0.2);
                padding-top: 20px;
                margin-top: -10px;
            }

            .nav-curadoria { 
                flex-wrap: nowrap; 
                justify-content: space-between; 
                gap: 4px;
            }

            .nav-curadoria a {
                font-size: clamp(0.8rem, 2.7vw, 1.3rem);
            }
            
            .banner-info-extra {
            font-size: clamp(0.8rem, 1.1vw, 0.88rem);
        }
        
        }
    </style>
</head>
<body>

<div id="bg-performance"></div>

<div class="hero-container">
    <div class="hero-content">
        <div class="logo">SANTACOSTA</div>
        
        <div id="anchor-banner"></div>

        <nav class="nav-curadoria">
            <a href="trabalhos.html">Trabalhos</a>
            <a href="expos.html">Exposições</a>
            <a href="textos.html">Textos</a>
            <a href="noticias.html">Notícias</a>
            <a href="bio.html">Bio</a>
        </nav>
    </div>
</div>
      
<script>
    // --- LÓGICA DE FUNDO DINÂMICO ---
    const imagensFundo = [
        'https://sitesantacosta.github.io/img/full/trabalhos/2025-h-serie-rastros-de-gestos/03.jpg',
        'https://sitesantacosta.github.io/img/full/trabalhos/2024-fases-tramadas/02.jpg',
        'https://sitesantacosta.github.io/img/full/trabalhos/2024-n1-serie-a-fome-do-tempo/04.jpg',
        'https://sitesantacosta.github.io/img/full/trabalhos/2026-io-serie-rastros-de-gestos/05.jpg',
        'https://sitesantacosta.github.io/img/full/trabalhos/2026-olho-de-tilda/05.jpg',
        'https://sitesantacosta.github.io/img/full/expos/2025-labirinto-mistico/0250826_rafael_massape_049.jpg'
    ];

    const bgElement = document.getElementById('bg-performance');

    function mudarImagem() {
        const indexAleatorio = Math.floor(Math.random() * imagensFundo.length);
        bgElement.style.backgroundImage = `url('${imagensFundo[indexAleatorio]}')`;
    }

    mudarImagem();
    bgElement.addEventListener('click', mudarImagem);

    // --- BUSCA DE EXPOSIÇÃO EM DESTAQUE E INJEÇÃO DO BANNER ---
    async function carregarDestaque() {
        try {
            const response = await fetch('https://sitesantacosta.github.io/code/data/expos.json?v=' + Date.now());
            const expos = await response.json();
            const emCartaz = expos.find(e => e.DESTAQUE);

            if (emCartaz) {
                const anchor = document.getElementById('anchor-banner');
                const banner = document.createElement('a');
                banner.id = 'banner-destaque';
                banner.href = 'expos.html';
                
                // Processa \n em quebras de linha para a info extra
                const infoExtra = emCartaz.INFO_DESTAQUE 
                    ? `<div class="banner-info-extra">${emCartaz.INFO_DESTAQUE.replace(/(?:\r\n|\r|\n|\\n)/g, '<br>')}</div>` 
                    : '';

                // Montagem HTML limpa e estruturada
                banner.innerHTML = `
                    <div class="banner-col-esq">
                        <span class="banner-badge">EM CARTAZ</span>
                        <span class="banner-titulo">${emCartaz.TEXTO}</span>
                    </div>
                    <div class="banner-col-dir">
                        <span class="banner-local">${emCartaz.LOCAL}</span>
                        ${infoExtra}
                    </div>
                `;
                
                anchor.replaceWith(banner);
            }
        } catch (error) {
            console.error("Erro ao carregar destaque:", error);
        }
    }

    carregarDestaque();
</script>
</body>
</html>
