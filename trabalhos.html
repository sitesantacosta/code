<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANTACOSTA | trabalhos</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-vivo: #e2ff8f;
            --verde-escuro: #505a50;
            --verde-medio: #697369;
            --fundo-claro: #f5f7f6;
            --fundo-medio: #e5eae7;
            --verde-escuro-fundo: #202420;
            --gap: 4px;
            --scroll-ratio: 0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0 !important; }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--verde-escuro-fundo);
            display: flex;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        #site-wrapper {
            width: 100%;
            max-width: 1400px;
            background-color: var(--fundo-medio);
            min-height: 100vh;
            position: relative;
        }

        /* --- HEADER --- */
        header { 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            background: var(--verde-vivo);
            border-bottom: 1px solid var(--verde-escuro-fundo);
        }

        .header-top { 
            display: flex; 
            align-items: center; 
            padding: 0 4vw;
            height: calc(100px - (var(--scroll-ratio) * 40px));
        }

        .logo { 
            font-weight: 800; 
            cursor: pointer; 
            letter-spacing: -2px;
            font-size: calc(4rem - (var(--scroll-ratio) * 1.6rem));
            margin-right: 40px;
            line-height: 1;
            color: var(--verde-escuro-fundo);
        }

        .desktop-nav {
            display: flex;
            gap: 25px;
            align-items: center;
            margin-left: auto;
        }

        .desktop-nav a {
            text-decoration: none;
            color: var(--verde-escuro-fundo);
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
            font-weight: 500;
            text-transform: uppercase;    
            transition: border-color 0.1s ease;
            border-bottom: 1px solid transparent;
        }

        .desktop-nav a:hover {
            text-decoration: underline;
            text-decoration-color: var(--fundo-claro);
            text-underline-offset: 0px;
            text-decoration-thickness: 10px;
        }

        .mobile-menu-trigger { display: none; margin-left: auto; cursor: pointer; }
        .icon-svg { width: 18px; height: 18px; fill: var(--verde-escuro-fundo); transition: transform 0.3s ease; }

        .nav-bar { 
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--fundo-claro); 
            height: 48px; 
            border-top: 1px solid var(--verde-escuro-fundo);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        /* --- GRID --- */
        #main-container { padding: 24px 76px; margin: 0 auto; background: var(--fundo-medio); }
        
        .grid-layout { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 18px; 
        }

        .obra-miniatura { 
            background: var(--fundo-claro); 
            display: flex; 
            flex-direction: column;
            cursor: pointer; 
            overflow: hidden; 
            padding-bottom: 12px;
        }

        .thumb-img-wrapper {
            width: 100%;
            aspect-ratio: 1/1; 
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .obra-miniatura img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: filter 0.3s ease;
        }

        .obra-info {
            padding: 12px 18px 8px;
            color: var(--verde-escuro-fundo); 
        }

        .obra-info strong { 
            display: block; 
            font-weight: 800; 
            font-size: clamp(0.88rem, 0.88rem + 1vw, 1.38em); 
            margin-bottom: 4px;
            line-height: 1.2;
            letter-spacing: -0.8px;
        }

        .obra-info span { 
            color: var(--verde-medio); 
            font-size: clamp(0.73rem, 0.73rem + 0.25vw, 0.94rem); 
            font-weight: 500;
            display: block;
        }

        .obra-miniatura:hover .obra-info strong,
        .obra-miniatura.ativo .obra-info strong {
            text-decoration: underline;
            text-decoration-color: var(--verde-vivo);
            text-underline-offset: 0px;
            text-decoration-thickness: 10px;
            text-decoration-skip-ink: none;
        }
        
        .obra-miniatura:hover img { filter: grayscale(0%); }
        .obra-miniatura.ativo img { filter: grayscale(100%); }

        /* --- ACORDEÃO --- */
        .acordeao-container { 
            grid-column: 1 / -1; 
            background: var(--fundo-claro); 
            margin: 50px 0;
            border-bottom: 1px solid var(--verde-vivo); 
            border-top: 1px solid var(--verde-vivo);
        }

        .carousel-view { 
            display: flex; 
            overflow-x: auto; 
            scroll-snap-type: x mandatory; 
            scrollbar-width: none;
            height: 60vh; 
            scroll-behavior: smooth; 
        }
        .carousel-view::-webkit-scrollbar { display: none; }
        .carousel-view img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: contain; scroll-snap-align: center; padding: 20px; cursor: zoom-in; }

        .indicadores { display: flex; justify-content: center; gap: 4px; margin: 20px 0; }
        .ponto { width: 45px; height: 12px; border: 1px solid var(--verde-escuro); background: var(--fundo-medio); cursor: pointer; }
        .ponto.ativo { background: var(--verde-vivo); }

        .ficha-tecnica { text-align: center; padding: 0 50px 30px; font-size: 0.75rem; line-height: 1.4; }
        .ficha-tecnica strong { display: block; font-size: 1.1rem; margin-bottom: 6px; }
        .ficha-tecnica span { display: block; color: var(--verde-medio); }
        .ficha-tecnica i { display: block; color: var(--verde-medio); font-style: italic; margin-top: 4px; }

        /* --- LIGHTBOX --- */
        #lightbox {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(32, 36, 32, 0.94); 
            z-index: 3000;
            display: none;
            flex-direction: column;
        }

        #lightbox-content {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            height: 100%;
            align-items: center;
            gap: 12px;
        }

        #lightbox-content::-webkit-scrollbar { display: none; }
        #lightbox-content img {
            flex: 0 0 100vw; 
            width: 94%; height: 94%;     
            max-width: 94vw; max-height: 94vh;
            object-fit: contain;
            scroll-snap-align: center;
            margin: 0 auto;  
        }

        .close-lb {
            position: absolute;
            top:18px; right:60px;
            font-size: 1.3rem; color: var(--verde-vivo); 
            cursor: pointer; z-index: 3001; font-weight: 500;
        }

        /* --- MENU MOBILE --- */
        #menu-full { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: var(--verde-vivo); z-index: 2000; display: none; 
            flex-direction: column; justify-content: center; align-items: center; gap: 30px;
        }
        #menu-full a { text-decoration: none; color: var(--verde-escuro-fundo); font-size: 1.5rem; font-weight: 800; }

        @media (max-width: 900px) {
            #main-container { padding: 0px 8px; } 
            .desktop-nav { display: none; }
            .mobile-menu-trigger { display: block; }
            .header-top { height: 70px !important; }
            .logo { font-size: 2rem !important; margin-right: 0; }
            .grid-layout { grid-template-columns: repeat(2, 1fr); gap: 8px; } 
            .obra-info { padding: 12px 12px 8px; }
            .carousel-view { height: 50vh; }
        }
    </style>
</head>
<body>

<div id="site-wrapper">
    <header id="dynamic-header">
        <div class="header-top">
            <div class="logo" onclick="location.href='index.html'">SANTACOSTA</div>
            <nav class="desktop-nav">
                <a style="font-weight: 400; cursor: default; color: var(--verde-medio)">TRABALHOS</a>
                <a href="expos.html">EXPOSIÇÕES</a>
                <a href="textos.html">TEXTOS</a>
                <a href="noticias.html">NOTÍCIAS</a>
                <a href="bio.html">BIO</a>
            </nav>
            <div class="mobile-menu-trigger" onclick="toggleMenu(true)">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </div>
        </div>
        <div class="nav-bar">Trabalhos</div>
    </header> 

    <div id="menu-full">
        <div onclick="toggleMenu(false)" style="position:absolute; top:20px; right:8vw; font-size:2.4rem; font-weight: 800; cursor:pointer;">✕</div>
        <a href="trabalhos.html">TRABALHOS</a>
        <a href="expos.html">EXPOSIÇÕES</a>
        <a href="textos.html">TEXTOS</a>
        <a href="noticias.html">NOTÍCIAS</a>
        <a href="bio.html">BIO</a>
    </div>

    <main id="main-container" class="grid-layout"></main>
</div>

<div id="lightbox" onclick="closeLightbox()">
    <div class="close-lb" onclick="closeLightbox()">✕</div>
    <div id="lightbox-content"></div>
</div>

<script>
    let dadosTrabalhos = [];
    let manifesto = {};
    let obraAberta = null;

    async function init() {
        try {
            const [resTrabalhos, resManifesto] = await Promise.all([
                fetch('https://sitesantacosta.github.io/code/data/trabalhos.json?v=' + Date.now()),
                fetch('https://sitesantacosta.github.io/img/manifesto.json?v=' + Date.now())
            ]);
            
            const rawTrabalhos = await resTrabalhos.json();
            manifesto = await resManifesto.json();
            dadosTrabalhos = processarDados(rawTrabalhos);

            render(dadosTrabalhos);

            // LOGICA DEEP LINK: Verifica se existe um hash na URL ao carregar
            const hash = window.location.hash.replace('#', '');
            if (hash) {
                const obraParaAbrir = dadosTrabalhos.find(o => o.PASTA === hash);
                if (obraParaAbrir) {
                    setTimeout(() => toggleObra(obraParaAbrir, dadosTrabalhos, true), 100);
                }
            }

        } catch (e) {
            console.error("Erro no carregamento:", e);
        }
    }

    function processarDados(lista) {
        const baseThumb = "https://sitesantacosta.github.io/img/thumb/trabalhos/";
        const baseFull = "https://sitesantacosta.github.io/img/full/trabalhos/";
        const baseZoom = "https://sitesantacosta.github.io/img/zoom/trabalhos/";

        return lista.map(item => {
            const arquivos = manifesto.trabalhos[item.PASTA] || [];
            return {
                ...item,
                fotosThumb: arquivos.map(arq => `${baseThumb}${item.PASTA}/${arq}`),
                fotosFull: arquivos.map(arq => `${baseFull}${item.PASTA}/${arq}`),
                fotosZoom: arquivos.map(arq => `${baseZoom}${item.PASTA}/${arq}`)
            };
        });
    }

    function render(lista) {
        const container = document.getElementById('main-container');
        container.innerHTML = '';
        
        const colunas = window.innerWidth <= 900 ? 2 : 3;
        const idxAberto = lista.findIndex(o => o.PASTA === obraAberta);
        const fimLinha = idxAberto !== -1 
            ? Math.min(Math.floor(idxAberto / colunas) * colunas + (colunas - 1), lista.length - 1) 
            : -1;

        lista.forEach((obra, i) => {
            const min = document.createElement('div');
            min.className = `obra-miniatura ${obraAberta === obra.PASTA ? 'ativo' : ''}`;
            const capa = obra.fotosThumb[0] || '';
            
            min.innerHTML = `
                <div class="thumb-img-wrapper">
                    ${capa ? `<img src="${capa}" alt="${obra.TITULO}">` : ''}
                </div>
                <div class="obra-info">
                    <strong>${obra.TITULO}</strong>
                    <span>${obra.TECNICA}</span>
                </div>
            `;
            min.onclick = () => toggleObra(obra, lista);
            container.appendChild(min);

            if (i === fimLinha && obraAberta) {
                container.appendChild(renderDetalhe(lista[idxAberto], idxAberto));
            }
        });
    }

    function renderDetalhe(obra, idx) {
        const div = document.createElement('div');
        div.className = 'acordeao-container';
        const carouselId = `carousel-${idx}`;
        
        div.innerHTML = `
            <div class="carousel-view" id="${carouselId}" onscroll="syncDots('${carouselId}')">
                ${obra.fotosFull.map((f, i) => `<img src="${f}" onclick="openLightbox(${idx}, ${i})">`).join('')}
            </div>
            ${obra.fotosFull.length > 1 ? `
                <div class="indicadores" id="dots-${carouselId}">
                    ${obra.fotosFull.map((_, i) => `<div class="ponto ${i===0?'ativo':''}" onclick="scrollCarousel('${carouselId}', ${i})"></div>`).join('')}
                </div>` : ''}
            <div class="ficha-tecnica">
                <strong>${obra.TITULO} (${obra.ANO})</strong>
                <span>${obra.TECNICA} | ${obra.DIMENSAO}</span>
                ${obra.EN ? `<i>${obra.EN}</i>` : ''}
            </div>
        `;
        return div;
    }

    function toggleObra(obra, lista, isInitial = false) {
        if (obraAberta === obra.PASTA) {
            obraAberta = null;
            // Limpa o hash da URL ao fechar
            history.pushState(null, null, window.location.pathname);
        } else {
            obraAberta = obra.PASTA;
            // Atualiza o hash da URL ao abrir (sem causar scroll indesejado do navegador)
            history.pushState(null, null, `#${obra.PASTA}`);
        }
        
        render(lista);

        if (obraAberta) {
            setTimeout(() => {
                const h = document.querySelector('header').offsetHeight;
                const acordeao = document.querySelector('.acordeao-container');
                if(acordeao) window.scrollTo({ top: acordeao.offsetTop - h + 1, behavior: isInitial ? 'instant' : 'smooth' });
            }, 100);
        }
    }

    function scrollCarousel(id, idx) {
        const el = document.getElementById(id);
        if (el) el.scrollTo({ left: el.offsetWidth * idx, behavior: 'smooth' });
    }

    function syncDots(id) {
        const el = document.getElementById(id);
        const dots = document.getElementById(`dots-${id}`);
        if (!dots) return;
        const current = Math.round(el.scrollLeft / el.offsetWidth);
        Array.from(dots.children).forEach((d, i) => d.classList.toggle('ativo', i === current));
    }

    function openLightbox(obraIdx, fotoIdx) {
        const obra = dadosTrabalhos[obraIdx];
        const content = document.getElementById('lightbox-content');
        content.innerHTML = obra.fotosZoom.map(f => `<img src="${f}" onclick="event.stopPropagation()">`).join('');
        document.getElementById('lightbox').style.display = 'flex';
        setTimeout(() => content.scrollTo({ left: content.offsetWidth * fotoIdx, behavior: 'instant' }), 10);
    }

    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
    }

    function toggleMenu(open) { 
        document.getElementById('menu-full').style.display = open ? 'flex' : 'none'; 
    }

    window.onscroll = () => {
        const scrollThreshold = 380; 
        const ratio = Math.min(window.scrollY / scrollThreshold, 1);
        document.documentElement.style.setProperty('--scroll-ratio', ratio);
    };
    
    window.addEventListener('keydown', (e) => { 
        if (e.key === 'Escape') { 
            if (document.getElementById('lightbox').style.display === 'flex') {
                closeLightbox(); 
            } else if (obraAberta) {
                obraAberta = null;
                history.pushState(null, null, window.location.pathname);
                render(dadosTrabalhos); 
            }
        } 
    });

    init();
</script>
</body>
</html>
