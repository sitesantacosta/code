<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANTACOSTA | exposições</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-vivo: #e2ff8f;
            --verde-escuro: #505a50;
            --verde-medio: #697369;
            --fundo-claro: #f5f7f6;
            --fundo-medio: #e5eae7;
            --verde-escuro-fundo: #202420;
            --gap: 4px;
            --scroll-ratio: 0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0 !important; }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--verde-escuro-fundo);
            display: flex;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        #site-wrapper {
            width: 100%;
            max-width: 1400px;
            background-color: var(--fundo-medio);
            min-height: 100vh;
            position: relative;
        }

        /* --- HEADER DINÂMICO --- */
        header { 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            background: var(--verde-vivo);
            border-bottom: 1px solid var(--verde-escuro-fundo);
        }

        .header-top { 
            display: flex; 
            align-items: center; 
            padding: 0 4vw;
            height: calc(100px - (var(--scroll-ratio) * 40px));
        }

        .logo { 
            font-weight: 800; 
            cursor: pointer; 
            letter-spacing: -2px;
            font-size: calc(4rem - (var(--scroll-ratio) * 1.6rem));
            margin-right: 40px;
            line-height: 1;
            color: var(--verde-escuro-fundo);
        }

        .desktop-nav {
            display: flex;
            gap: 25px;
            align-items: center;
            margin-left: auto;
            margin-right: 0;
        }

        .desktop-nav a {
            text-decoration: none;
            color: var(--verde-escuro-fundo);
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
            font-weight: 500;
            text-transform: uppercase;    
            transition: border-color 0.1s ease;
            border-bottom: 1px solid transparent;
        }

        .desktop-nav a:hover {
            text-decoration: underline;
            text-decoration-color: var(--fundo-claro);
            text-underline-offset: 0px;
            text-decoration-thickness: 10px;
            text-decoration-skip-ink: none;
        }

        .mobile-menu-trigger { display: none; margin-left: auto; cursor: pointer; }
        .icon-svg { width: 18px; height: 18px; fill: var(--verde-escuro-fundo); transition: transform 0.3s ease; }

        /* --- CONTAINER PRINCIPAL --- */
        #main-container { padding: 24px 76px; margin: 0 auto; background: var(--fundo-medio); }
        
        /* --- LAYOUT DE DESTAQUES --- */
        .destaques-layout {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 18px;
        }

        .obra-destaque {
            background: var(--fundo-claro);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            overflow: hidden;
            border: 1px solid var(--fundo-medio);
            transition: border-color 0.3s ease;
        }


        .destaque-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Alterado de cover para contain */
            filter: grayscale(0%);
            transition: filter 0.3s ease;
        }

        .destaque-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(0%);
            transition: filter 0.3s ease;
        }

        .obra-destaque.ativo .destaque-img-wrapper img { filter: grayscale(100%); }

        .expo-destaque-info {
            padding: 24px 32px;
            color: var(--verde-escuro-fundo);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .badge-destaque {
            align-self: flex-start;
            background: var(--verde-vivo);
            color: var(--verde-escuro-fundo);
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 8px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .expo-destaque-info strong {
            font-size: clamp(1.4rem, 2.5vw, 2.2rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 6px;
            letter-spacing: -1px;
        }

        .expo-destaque-info span {
            color: var(--verde-medio);
            font-size: clamp(0.9rem, 1.2vw, 1.1rem);
            font-weight: 500;
        }

        .info-destaque {
            margin-top: 16px;
            color: var(--verde-escuro);
            font-size: clamp(0.85rem, 1vw, 0.95rem);
            line-height: 1.5;
            font-weight: 400;
        }

        .obra-destaque:hover .expo-destaque-info strong,
        .obra-destaque.ativo .expo-destaque-info strong {
            text-decoration: underline;
            text-decoration-color: var(--verde-vivo);
            text-underline-offset: 0px;
            text-decoration-thickness: 10px;
            text-decoration-skip-ink: none;
        }

        /* --- GRID NORMAL --- */
        .grid-layout { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 18px; 
        }

        .obra-miniatura { 
            background: var(--fundo-claro); 
            display: flex; 
            flex-direction: column;
            cursor: pointer; 
            overflow: hidden; 
            padding-bottom: 12px;
        }

        .thumb-img-wrapper {
            width: 100%;
            aspect-ratio: 3/2; 
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .obra-miniatura img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: filter 0.3s ease;
        }

        .expo-thumb-info {
            padding: 12px 18px 8px;
            color: var(--verde-escuro-fundo); 
        }

        .expo-thumb-info strong { 
            display: block; 
            font-weight: 800; 
            font-size: clamp(0.88rem, 0.88rem + 1vw, 1.38em); 
            margin-bottom: 4px;
            line-height: 1.2;
            letter-spacing: -0.8px;
        }

        .expo-thumb-info span { 
            color: var(--verde-medio); 
            font-size: clamp(0.73rem, 0.73rem + 0.25vw, 0.94rem); 
            font-weight: 500;
            display: block;
        }

        .obra-miniatura:hover .expo-thumb-info strong,
        .obra-miniatura.ativo .expo-thumb-info strong {
            text-decoration: underline;
            text-decoration-color: var(--verde-vivo);
            text-underline-offset: 0px;
            text-decoration-thickness: 10px;
            text-decoration-skip-ink: none;
        }
        
        .obra-miniatura:hover img { filter: grayscale(0%); }
        .obra-miniatura.ativo img { filter: grayscale(100%); }

        /* --- ACORDEÃO E CARROSSEL --- */
        .acordeao-container { 
            grid-column: 1 / -1; 
            background: var(--fundo-claro); 
            margin: 50px 0;
            border-bottom: 1px solid var(--verde-vivo); 
            border-top: 1px solid var(--verde-vivo);
        }

        .carousel-view { 
            display: flex; 
            overflow-x: auto; 
            scroll-snap-type: x mandatory; 
            scrollbar-width: none;
            height: 60vh; 
            scroll-behavior: smooth; 
        }
        .carousel-view::-webkit-scrollbar { display: none; }
        .carousel-view img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: contain; scroll-snap-align: center; padding: 20px; cursor: zoom-in; }

        .indicadores { display: flex; justify-content: center; gap: 4px; margin: 20px 0; }
        .ponto { width: 45px; height: 12px; border: 1px solid var(--verde-escuro); background: var(--fundo-medio); cursor: pointer; }
        .ponto.ativo { background: var(--verde-vivo); }

        .ficha-tecnica { text-align: center; padding: 0 50px 30px; font-size: 0.75rem; line-height: 1.4; }
        .ficha-tecnica strong { display: block; font-size: 1.1rem; margin-bottom: 6px; }
        .ficha-tecnica span { display: block; color: var(--verde-medio); }
        .ficha-tecnica p { margin-top: 10px; color: var(--verde-escuro); }
        .ficha-tecnica i { display: block; color: var(--verde-medio); font-style: italic; margin-top: 4px; }

        /* --- LIGHTBOX --- */
        #lightbox {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            background-color: rgba(32, 36, 32, 0.94); 
            z-index: 3000;
            display: none;
            flex-direction: column;
        }

        #lightbox-content {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            height: 100%;
            align-items: center;
            gap: 12px;
        }

        #lightbox-content::-webkit-scrollbar { display: none; }

        #lightbox-content img {
            flex: 0 0 100vw; 
            width: 94%;      
            height: 94%;     
            max-width: 94vw; 
            max-height: 94vh;
            object-fit: contain;
            scroll-snap-align: center;
            margin: 0 auto;  
        }

        .close-lb {
            position: absolute;
            top:18px; 
            right:60px;
            font-size: 1.3rem; 
            color: var(--verde-vivo); 
            cursor: pointer;
            z-index: 3001;
            font-weight: 500;
        }

        /* --- MENU FULL (MOBILE) --- */
        #menu-full { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: var(--verde-vivo); z-index: 2000; display: none; 
            flex-direction: column; justify-content: center; align-items: center; gap: 30px;
        }

        #menu-full a { 
            text-decoration: none; color: var(--verde-escuro-fundo); 
            font-size: 1.5rem; font-weight: 800;
        }

        /* --- RESPONSIVIDADE --- */
        @media (min-width: 900px) {
            .obra-destaque { flex-direction: row; height: 400px; margin-bottom: 24px; }
            
            .destaque-img-wrapper { 
                width: auto; /* A imagem não força mais os 66% fixos */
                height: 100%; 
                flex-shrink: 0; /* Impede a imagem de ser esmagada */
                max-width: 70%; /* Trava de segurança para panoramas não engolirem o texto */
            }
            
            .destaque-img-wrapper img {
                width: auto; /* A largura se adapta à altura de 400px mantendo a proporção */
                height: 100%;
                max-width: 100%;
                object-fit: contain; 
            }
            
            .expo-destaque-info { 
                width: auto; 
                flex-grow: 1; /* Instrui o container a preencher "a largura restante da área total" */
                padding: 40px 50px; 
            }
        }

        @media (max-width: 900px) {
            #main-container { padding: 0px 8px; } 
            .desktop-nav { display: none; }
            .mobile-menu-trigger { display: block; }
            .header-top { height: 70px !important; }
            .logo { font-size: 2rem !important; margin-right: 0; }
            .grid-layout { grid-template-columns: repeat(2, 1fr); gap: 8px; } 
            .destaques-layout { gap: 8px; margin-bottom: 8px; }
            .expo-thumb-info { padding: 12px 12px 8px; letter-spacing: -0.2px; }
            .expo-destaque-info { padding: 20px; }
            .carousel-view { height: 50vh; }
            .obra-destaque { flex-direction: column-reverse; margin-bottom: 24px;}
        }
    </style>
</head>
<body>

<div id="site-wrapper">
    <header id="dynamic-header">
        <div class="header-top">
            <div class="logo" onclick="location.href='index.html'">SANTACOSTA</div>
            <nav class="desktop-nav">
                <a href="trabalhos.html">TRABALHOS</a>
                <a style="font-weight: 400; cursor: default; color: var(--verde-medio)">EXPOSIÇÕES</a>
                <a href="textos.html">TEXTOS</a>
                <a href="noticias.html">NOTÍCIAS</a>
                <a href="bio.html">BIO</a>
            </nav>
            <div class="mobile-menu-trigger" onclick="toggleMenu(true)">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </div>
        </div>
    </header> 

    <div id="menu-full">
        <div onclick="toggleMenu(false)" style="position:absolute; top:20px; right:8vw; font-size:2.4rem; font-weight: 800; cursor:pointer;">✕</div>
        <a href="trabalhos.html" style="font-size:2.4rem; font-weight: 800;">TRABALHOS</a>
        <a href="expos.html" style="font-size:2.4rem; font-weight: 800;">EXPOSIÇÕES</a>
        <a href="textos.html" style="font-size:2.4rem; font-weight: 800;">TEXTOS</a>
        <a href="noticias.html" style="font-size:2.4rem; font-weight: 800;">NOTÍCIAS</a>
        <a href="bio.html" style="font-size:2.4rem; font-weight: 800;">BIO</a>
    </div>

    <main id="main-container"></main>
</div>

<div id="lightbox" onclick="closeLightbox()">
    <div class="close-lb" onclick="closeLightbox()">✕</div>
    <div id="lightbox-content"></div>
</div>

<script>
    let rawExpos = [];
    let manifesto = {};
    let tituloAberto = null;

    async function init() {
        try {
            const [resExpos, resManifesto] = await Promise.all([
                fetch('/data/expos.json?v=' + Date.now()),
                fetch('https://sitesantacosta.github.io/img/manifesto.json?v=' + Date.now())
            ]);
            
            rawExpos = await resExpos.json();
            manifesto = await resManifesto.json();

            render(processarDados());
        } catch (e) {
            console.error("Erro no carregamento:", e);
        }
    }

    function processarDados() {
        const baseThumb = "https://sitesantacosta.github.io/img/thumb/expos/";
        const baseFull = "https://sitesantacosta.github.io/img/full/expos/";
        const baseZoom = "https://sitesantacosta.github.io/img/zoom/expos/";

        const listaProcessada = rawExpos.map(item => {
            const todosArquivos = manifesto.expos[item.PASTA] || [];
            
            // Separa a imagem destaque (destaque.jpg) das demais imagens da obra
            const isDestaqueImg = (arq) => arq.toLowerCase() === 'destaque.jpg';
            const imgDestaque = todosArquivos.find(isDestaqueImg);
            const arquivosNormais = todosArquivos.filter(arq => !isDestaqueImg(arq));
            
            return {
                ...item,
                imgCapaDestaque: imgDestaque ? `${baseFull}${item.PASTA}/${imgDestaque}` : null,
                fotosThumb: arquivosNormais.map(arq => `${baseThumb}${item.PASTA}/${arq}`),
                fotosFull: arquivosNormais.map(arq => `${baseFull}${item.PASTA}/${arq}`),
                fotosZoom: arquivosNormais.map(arq => `${baseZoom}${item.PASTA}/${arq}`)
            };
        });

        return [...listaProcessada].reverse();
    }

    function render(lista) {
        const container = document.getElementById('main-container');
        container.innerHTML = '';
        
        const itens = lista.map((expo, i) => ({ expo, idxOriginal: i }));
        const destaques = itens.filter(item => item.expo.DESTAQUE);
        const normais = itens.filter(item => !item.expo.DESTAQUE);

        // --- 1. RENDERIZAÇÃO DOS DESTAQUES ---
        if (destaques.length > 0) {
            const destContainer = document.createElement('div');
            destContainer.className = 'destaques-layout';
            container.appendChild(destContainer);

            destaques.forEach(item => {
                const dest = document.createElement('div');
                dest.className = `obra-destaque ${tituloAberto === item.expo.TEXTO ? 'ativo' : ''}`;
                
                // Prioridade 1: destaque.jpg, Prioridade 2: Primeira full normal, Prioridade 3: Primeira thumb normal
                const capa = item.expo.imgCapaDestaque || item.expo.fotosFull[0] || item.expo.fotosThumb[0] || '';
                
                // Trata as quebras de linha vindas do JSON/Sheets (\n)
                const infoDestaqueHTML = item.expo.INFO_DESTAQUE 
                    ? `<p class="info-destaque">${item.expo.INFO_DESTAQUE.replace(/(?:\r\n|\r|\n|\\n)/g, '<br>')}</p>` 
                    : '';

                dest.innerHTML = `
                    <div class="destaque-img-wrapper">
                        ${capa ? `<img src="${capa}" alt="${item.expo.TEXTO}">` : ''}
                    </div>
                    <div class="expo-destaque-info">
                        <span class="badge-destaque">EM CARTAZ</span>
                        <strong>${item.expo.TEXTO}</strong>
                        <span>${item.expo.LOCAL}</span>
                        ${infoDestaqueHTML}
                    </div>
                `;
                dest.onclick = () => toggleExpo(item.expo, lista);
                destContainer.appendChild(dest);

                if (tituloAberto === item.expo.TEXTO) {
                    destContainer.appendChild(renderDetalhe(item.expo, item.idxOriginal));
                }
            });
        }

        // --- 2. RENDERIZAÇÃO DO GRID NORMAL ---
        if (normais.length > 0) {
            const gridContainer = document.createElement('div');
            gridContainer.className = 'grid-layout';
            container.appendChild(gridContainer);

            const colunas = window.innerWidth <= 900 ? 2 : 3;
            const idxAbertoNormal = normais.findIndex(item => item.expo.TEXTO === tituloAberto);
            const fimLinhaNormal = idxAbertoNormal !== -1 
                ? Math.min(Math.floor(idxAbertoNormal / colunas) * colunas + (colunas - 1), normais.length - 1) 
                : -1;

            normais.forEach((item, indexNoGrid) => {
                const min = document.createElement('div');
                min.className = `obra-miniatura ${tituloAberto === item.expo.TEXTO ? 'ativo' : ''}`;
                // A capa do grid normal ignora o destaque.jpg porque ele já foi removido em processarDados()
                const capa = item.expo.fotosThumb[0] || '';
                
                min.innerHTML = `
                    <div class="thumb-img-wrapper">
                        ${capa ? `<img src="${capa}" alt="${item.expo.TEXTO}">` : ''}
                    </div>
                    <div class="expo-thumb-info">
                        <strong>${item.expo.TEXTO}</strong>
                        <span>${item.expo.LOCAL}</span>
                    </div>
                `;
                min.onclick = () => toggleExpo(item.expo, lista);
                gridContainer.appendChild(min);

                if (indexNoGrid === fimLinhaNormal && tituloAberto) {
                    gridContainer.appendChild(renderDetalhe(normais[idxAbertoNormal].expo, normais[idxAbertoNormal].idxOriginal));
                }
            });
        }
    }

    function renderDetalhe(expo, idx) {
        const div = document.createElement('div');
        div.className = 'acordeao-container';
        const carouselId = `carousel-${idx}`;
        
        // Garante suporte para \n na ficha técnica caso venha da planilha
        const infoHTML = expo.INFO ? `<p>${expo.INFO.replace(/(?:\r\n|\r|\n|\\n)/g, '<br>')}</p>` : '';

        div.innerHTML = `
            <div class="carousel-view" id="${carouselId}" onscroll="syncDots('${carouselId}')">
                ${expo.fotosFull.map((f, i) => `<img src="${f}" onclick="openLightbox(${idx}, ${i})">`).join('')}
            </div>
            ${expo.fotosFull.length > 1 ? `
                <div class="indicadores" id="dots-${carouselId}">
                    ${expo.fotosFull.map((_, i) => `<div class="ponto ${i===0?'ativo':''}" onclick="scrollCarousel('${carouselId}', ${i})"></div>`).join('')}
                </div>` : ''}
            <div class="ficha-tecnica">
                <strong>${expo.TEXTO}</strong>
                <span>${expo.LOCAL} | ${expo.CIDADE} | ${expo.DATA}</span>
                ${infoHTML}
                ${expo.EN ? `<i>${expo.EN}</i>` : ''}
            </div>
        `;
        return div;
    }

    function toggleExpo(expo, lista) {
        tituloAberto = (tituloAberto === expo.TEXTO) ? null : expo.TEXTO;
        render(lista);
        if (tituloAberto) {
            setTimeout(() => {
                const h = document.querySelector('header').offsetHeight;
                const acordeao = document.querySelector('.acordeao-container');
                if(acordeao) window.scrollTo({ top: acordeao.offsetTop - h + 1, behavior: 'smooth' });
            }, 100);
        }
    }

    function scrollCarousel(id, idx) {
        const el = document.getElementById(id);
        if (el) el.scrollTo({ left: el.offsetWidth * idx, behavior: 'smooth' });
    }

    function syncDots(id) {
        const el = document.getElementById(id);
        const dots = document.getElementById(`dots-${id}`);
        if (!dots) return;
        const current = Math.round(el.scrollLeft / el.offsetWidth);
        Array.from(dots.children).forEach((d, i) => d.classList.toggle('ativo', i === current));
    }

    function openLightbox(expoIdx, fotoIdx) {
        const listaAtual = processarDados();
        const expo = listaAtual[expoIdx];
        const content = document.getElementById('lightbox-content');
        
        content.innerHTML = expo.fotosZoom.map(f => `<img src="${f}" onclick="event.stopPropagation()">`).join('');
        document.getElementById('lightbox').style.display = 'flex';
        
        setTimeout(() => content.scrollTo({ left: content.offsetWidth * fotoIdx, behavior: 'instant' }), 10);
    }

    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
    }

    function toggleMenu(open) { 
        document.getElementById('menu-full').style.display = open ? 'flex' : 'none'; 
    }

    window.onscroll = () => {
        const scrollThreshold = 380; 
        const ratio = Math.min(window.scrollY / scrollThreshold, 1);
        document.documentElement.style.setProperty('--scroll-ratio', ratio);
    };
    
    window.addEventListener('keydown', (e) => { 
        if (e.key === 'Escape') { 
            if (document.getElementById('lightbox').style.display === 'flex') {
                closeLightbox(); 
            } else {
                tituloAberto = null; 
                render(processarDados()); 
            }
        } 
    });

    init();
</script>
</body>
</html>
